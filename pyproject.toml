[project]
name = "harmness"
version = "0.1.0"
description = "Measure potential harms and auto-test a solution before it can be accepted."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "harmness",
  "harm measurement",
  "potential harms",
  "harm catalog",
  "auto-test",
  "solution gate",
  "harm score",
  "safety",
  "security",
  "risk assessment",
  "static analysis",
  "open source",
  "cli",
  "ai safety",
]
authors = [{ name = "Qaiser Mehmood" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/qmmughal/harmness"
Repository = "https://github.com/qmmughal/harmness"
Documentation = "https://github.com/qmmughal/harmness/blob/main/README.md"
Issues = "https://github.com/qmmughal/harmness/issues"

[project.scripts]
harmness = "harmness.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harmness = ["harms.json"]
